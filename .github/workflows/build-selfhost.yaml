name: Build self-hosted (Windows + macOS)

# Unsigned Windows installer and self-signed macOS app pointed at the self-hosted
# Mailspring-API, uploaded to its auto-update directory.
#
# Variables: MAILSPRING_SERVER_URL
# Secrets:   MAILSPRING_UPDATE_TOKEN, DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
#            MAC_CERT_P12 (base64), MAC_CERT_PASSWORD

on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # Squirrel only installs a higher version, so every build gets its own patch number:
      # 1.26.2 -> 1.26.<2000 + run number>. An upstream 1.26.3 base still sorts above it.
      - name: Compute version
        id: version
        run: |
          node -e '
            const [major, minor, patch] = require("./app/package.json").version.split(".").map(Number);
            console.log(`version=${major}.${minor}.${patch * 1000 + Number(process.env.GITHUB_RUN_NUMBER)}`);
          ' >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: mailspring-windows-x64
          - os: macos-26
            artifact: mailspring-macos-arm64

    runs-on: ${{ matrix.os }}

    env:
      MAILSPRING_SERVER_URL: ${{ vars.MAILSPRING_SERVER_URL }}
      MAILSPRING_UPDATE_TOKEN: ${{ secrets.MAILSPRING_UPDATE_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Write self-host config
        run: node scripts/selfhost-config.js

      - name: Install Dependencies
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("app/package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("app/package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      # Upstream's Windows mailsync lowercases folder names in the user's locale, so on a
      # Turkish system INBOX never gets the inbox role. Use the patched build from our fork.
      - name: Replace mailsync with the patched build
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download selfhost-win-ia32 -R "${{ github.repository_owner }}/mailspring-sync" -p mailsync.tar.gz -D app --clobber
          tar -xzf app/mailsync.tar.gz -C app

      - name: Build
        run: npm run build -- --skip-installers

      # Squirrel.Mac only applies an update whose signature satisfies the running app's
      # designated requirement. An ad-hoc signature pins that to the build's own cdhash,
      # so the app must be signed with the same certificate every time.
      - name: Sign and zip macOS app
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk '/^ *1\)/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then echo "No code signing identity in MAC_CERT_P12"; exit 1; fi

          cd app/dist/Mailspring-darwin-*
          codesign --force --deep --keychain "$KEYCHAIN" --sign "$IDENTITY" Mailspring.app
          mkdir -p "$GITHUB_WORKSPACE/app/dist/upload"
          ditto -c -k --keepParent Mailspring.app "$GITHUB_WORKSPACE/app/dist/upload/Mailspring-$VERSION.zip"

      # mailsync exits with code 2 unless its own path contains "mailspring"; Squirrel
      # installs to %LocalAppData%\Mailspring, which satisfies that.
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node app/build/create-signed-windows-installer.js
          New-Item -ItemType Directory -Force app/dist/upload | Out-Null
          Move-Item app/dist/MailspringSetup.exe, app/dist/RELEASES, app/dist/*-full.nupkg app/dist/upload/

      # The app embeds the server URL, so artifacts live only until the publish job
      # has copied them to the server and deletes them.
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: app/dist/upload
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    env:
      VERSION: ${{ needs.version.outputs.version }}
      UPDATE_TOKEN: ${{ secrets.MAILSPRING_UPDATE_TOKEN }}

    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          path: builds

      - name: Stage update directory
        run: |
          WIN="stage/$UPDATE_TOKEN/win32-x64"
          MAC="stage/$UPDATE_TOKEN/darwin-arm64"
          mkdir -p "$WIN" "$MAC"
          cp builds/mailspring-windows-x64/* "$WIN/"
          cp builds/mailspring-macos-arm64/* "$MAC/"
          echo "{\"version\":\"$VERSION\",\"path\":\"\"}" > "$WIN/latest.json"
          echo "{\"version\":\"$VERSION\",\"path\":\"Mailspring-$VERSION.zip\"}" > "$MAC/latest.json"

      # The deploy key is pinned to rrsync on the server, rooted at the updates directory.
      - name: Upload to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rt --delete --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            stage/ "mailspring-deploy@$DEPLOY_HOST:"
          rm ~/.ssh/deploy_key

      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[].id' |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/{}"
